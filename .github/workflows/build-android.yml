name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - update/live-render-terminal
      - rebuild/smart-core-audit
      - integrate/visual-analysis-android
      - snapshot/phone-project-2026-11-13
      - feature/hybrid-pro-studio-2026-11-13

# Keep only the newest build per branch; older APK builds become obsolete
# after each incremental source commit.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python for backend syntax checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check backend Python syntax
        run: python -m compileall -q backend

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK (retry transient download failures)
        working-directory: android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Gradle build attempt ${attempt}/3"
            if ./gradlew --no-daemon assembleDebug; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle failed; waiting 15 seconds before retry..."
              sleep 15
            fi
          done
          echo "Gradle build failed after 3 attempts"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cheat-Clip-Pro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
