name: Clean Git History

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-git-history
  cancel-in-progress: false

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Fetch every branch and tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --prune

          # Detach the worktree so no checked-out branch is moved.
          current_branch="$(git branch --show-current)"
          git checkout --detach
          if [ -n "$current_branch" ]; then
            git branch -D "$current_branch"
          fi

          # Recreate every remote branch as a local branch for filter-repo.
          while IFS= read -r remote_ref; do
            branch="${remote_ref#refs/remotes/origin/}"
            [ "$branch" = "HEAD" ] && continue
            git branch "$branch" "$remote_ref"
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/)

          echo "Branches prepared for rewrite:"
          git branch --list

      - name: Install git-filter-repo
        run: |
          python -m pip install --user git-filter-repo
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Remove historical production environment files
        run: |
          git filter-repo --force --path-regex '(^|/)\.env\.production$' --invert-paths

      - name: Verify removed paths
        run: |
          set -euo pipefail
          if git rev-list --objects --all | grep -E '(^|/)\.env\.production$'; then
            echo "ERROR: .env.production is still reachable from a rewritten ref."
            exit 1
          fi
          echo "Verified: no .env.production file is reachable from local branches or tags."

      - name: Push rewritten branches and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin --force --all
          git push origin --force --tags
